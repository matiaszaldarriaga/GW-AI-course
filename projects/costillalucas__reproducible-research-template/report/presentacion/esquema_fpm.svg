<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 545" width="1300" height="545"
     font-family="Helvetica, Arial, sans-serif" aria-label="Esquema de FPM: una captura por LED y sintesis de apertura en el espacio de frecuencias">
  <rect width="1300" height="545" fill="#fcfcfb"/>

  <!-- ============ Panel A: la captura ============ -->
  <text x="40" y="52" font-size="24" font-weight="bold" fill="#0b0b0b">1 · Una captura por LED</text>
  <text x="40" y="82" font-size="19" fill="#52514e">cada LED ilumina con un ángulo distinto</text>

  <g fill="#c9c8c3">
    <circle cx="70" cy="150" r="6"/><circle cx="100" cy="150" r="6"/><circle cx="130" cy="150" r="6"/><circle cx="160" cy="150" r="6"/><circle cx="190" cy="150" r="6"/>
    <circle cx="70" cy="185" r="6"/><circle cx="130" cy="185" r="6"/><circle cx="160" cy="185" r="6"/><circle cx="190" cy="185" r="6"/>
    <circle cx="70" cy="220" r="6"/><circle cx="100" cy="220" r="6"/><circle cx="130" cy="220" r="6"/><circle cx="160" cy="220" r="6"/><circle cx="190" cy="220" r="6"/>
    <circle cx="70" cy="255" r="6"/><circle cx="100" cy="255" r="6"/><circle cx="130" cy="255" r="6"/><circle cx="160" cy="255" r="6"/><circle cx="190" cy="255" r="6"/>
    <circle cx="70" cy="290" r="6"/><circle cx="100" cy="290" r="6"/><circle cx="130" cy="290" r="6"/><circle cx="160" cy="290" r="6"/><circle cx="190" cy="290" r="6"/>
  </g>
  <circle cx="100" cy="185" r="9" fill="#eb6834"/>
  <text x="66" y="332" font-size="18" fill="#52514e">arreglo de LEDs (9 × 9)</text>

  <!-- haz oblicuo del LED encendido -->
  <g stroke="#eb6834" stroke-width="2" fill="none" opacity="0.85">
    <line x1="107" y1="188" x2="300" y2="228"/>
    <line x1="107" y1="181" x2="300" y2="176"/>
  </g>
  <line x1="230" y1="202" x2="640" y2="202" stroke="#c9c8c3" stroke-width="1.5" stroke-dasharray="7 6"/>
  <path d="M 252 202 A 48 48 0 0 0 248 185" stroke="#eb6834" stroke-width="1.6" fill="none"/>
  <text x="260" y="188" font-size="18" fill="#eb6834">θ</text>

  <rect x="300" y="168" width="14" height="70" rx="3" fill="#e4e3df" stroke="#9a998f" stroke-width="1.5"/>
  <text x="270" y="264" font-size="18" fill="#52514e">muestra</text>

  <ellipse cx="470" cy="202" rx="13" ry="52" fill="#dce9fb" stroke="#2a78d6" stroke-width="2"/>
  <text x="420" y="288" font-size="18" fill="#52514e">objetivo</text>
  <text x="420" y="310" font-size="18" fill="#52514e">NA 0.10</text>

  <g stroke="#2a78d6" stroke-width="1.8" fill="none" opacity="0.8">
    <line x1="314" y1="176" x2="460" y2="163"/>
    <line x1="314" y1="228" x2="460" y2="241"/>
    <line x1="480" y1="163" x2="590" y2="186"/>
    <line x1="480" y1="241" x2="590" y2="218"/>
  </g>
  <line x1="314" y1="172" x2="452" y2="120" stroke="#9a998f" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="326" y="112" font-size="17" fill="#8a8984">lo que la NA no acepta</text>

  <rect x="590" y="160" width="40" height="84" rx="4" fill="#e4e3df" stroke="#9a998f" stroke-width="1.5"/>
  <text x="566" y="272" font-size="18" fill="#52514e">cámara</text>

  <text x="40" y="416" font-size="19" fill="#0b0b0b">Se guarda una imagen de baja resolución por LED y por</text>
  <text x="40" y="442" font-size="19" fill="#0b0b0b">color: 81 × 3 capturas de la misma muestra.</text>

  <line x1="676" y1="40" x2="676" y2="500" stroke="#e4e3df" stroke-width="2"/>

  <!-- ============ Panel B: el espacio de frecuencias ============ -->
  <text x="712" y="52" font-size="24" font-weight="bold" fill="#0b0b0b">2 · En el espacio de frecuencias</text>
  <text x="712" y="82" font-size="19" fill="#52514e">ese ángulo traslada el espectro dentro de la pupila</text>

  <!-- apertura sintetica: radio = desplazamiento maximo + radio de pupila -->
  <circle cx="985" cy="250" r="142" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="9 7"/>

  <g fill="#2a78d6" fill-opacity="0.12" stroke="#2a78d6" stroke-width="1.8">
    <circle cx="985" cy="250" r="80"/>
    <circle cx="1047" cy="250" r="80"/>
    <circle cx="923" cy="250" r="80"/>
    <circle cx="985" cy="188" r="80"/>
    <circle cx="985" cy="312" r="80"/>
  </g>
  <circle cx="941" cy="206" r="80" fill="#eb6834" fill-opacity="0.16" stroke="#eb6834" stroke-width="2.6"/>

  <line x1="985" y1="250" x2="1160" y2="250" stroke="#9a998f" stroke-width="1.2"/>
  <line x1="985" y1="250" x2="985" y2="98" stroke="#9a998f" stroke-width="1.2"/>
  <text x="1166" y="256" font-size="18" fill="#8a8984">kx</text>
  <text x="993" y="104" font-size="18" fill="#8a8984">ky</text>

  <line x1="900" y1="288" x2="820" y2="330" stroke="#eb6834" stroke-width="1.4"/>
  <text x="700" y="352" font-size="18" fill="#eb6834">pupila del objetivo,</text>
  <text x="700" y="374" font-size="18" fill="#eb6834">corrida por ese LED</text>

  <line x1="1082" y1="352" x2="1130" y2="392" stroke="#0b0b0b" stroke-width="1.4"/>
  <text x="1010" y="414" font-size="18" fill="#0b0b0b">apertura sintética:</text>
  <text x="1010" y="436" font-size="18" fill="#0b0b0b">NA objetivo + NA iluminación</text>

  <text x="712" y="480" font-size="19" fill="#0b0b0b">La unión de todas las pupilas corridas fija la resolución final;</text>
  <text x="712" y="506" font-size="19" fill="#0b0b0b">el solapamiento entre ellas permite recuperar la fase.</text>
</svg>
