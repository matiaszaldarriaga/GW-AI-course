- id: detection-threshold
  statement: At the pre-registered operating point, FAR = 1/(100 yr) over T_obs = 1 yr with
    FAP = 1 - exp(-FAR T_obs) under a Poisson false-alarm-process convention, the threshold
    rho* follows from the exact single-sample Gaussian tail of the phase-maximised statistic
    and an effective trial rate nu_eff calibrated from simulated maxima and extrapolated to
    T_obs. The independent-trials combination 1 - (1 - p)^N_eff is kept distinct from its
    rare-tail Poisson approximation, and the approximation error is measured. Closing the
    loop MM -> N_templates -> nu_eff -> rho* makes the threshold depend on the bank, with
    FAR = 1/yr and 5 sigma (global probability) as sensitivities.
  status: MEASURED. The naive trials bound is a proved upper bound for a finite grid in Gaussian
    noise; the calibrated rate is 6 to 58 times smaller and grows as N_templates^0.15-0.22
    within each family. The calibration is made near |z| = 5.3-5.8 and applied near 8.0-8.6,
    an extrapolation this work does not test.
  evidence:
  - data/part_e_mm097.json::thresholds at the operating point and its two sensitivities
  - data/part_e_nu_eff.json::the calibrated trials rate and its exponent, per family
  - scripts/make_figures.py::figure_trials
  numbers:
  - nu_eff_main_hexagonal_mm097
  - poisson_approximation_error
  - rho_star_naive_extended_hexagonal
  - rho_star_naive_extended_square
  - rho_star_naive_main_hexagonal
  - rho_star_naive_main_square
  - trials_exponent_extended_hexagonal
  - trials_exponent_extended_square
  - trials_exponent_main_hexagonal
  - trials_exponent_main_square
  - trials_exponent_pooled
- id: volume-loss-rule
  statement: 'The worst-case fractional detection-volume loss at fixed threshold is exactly
    1 - MM^3, of which 3(1 - MM) is the linear expansion; the population-average loss 1 -
    <M_bank^3> is estimated separately with the quadratic metric, for TaylorF2 injections
    (discretisation only) and IMRPhenomD
    injections (template-family error plus discretisation). With the bank-dependent threshold,
    the effective volume <M_bank^3>/rho*^3 is maximised over MM, and whether that maximum
    lies inside the range studied is reported with its uncertainty. This is a measurement
    of a known trade-off for this configuration, not a new effect: see prior_work. What is
    ours is the closed loop evaluated end to end with a modern PSD — nu_eff calibrated from
    simulated maxima rather than assumed, <M_bank^3> from metric-evaluated injections rather than from the
    geometric approximation, the three volume losses kept apart, and TaylorF2 and IMRPhenomD
    reported separately.'
  status: >-
    MEASURED WITH A MODEL LIMIT. The population-average loss is 4-9 times below the
    worst case. The pre-registered hypothesis of an interior V_eff optimum is not supported:
    the trend reverses between the naive and fitted trials models, while the fitted nu_eff
    is extrapolated beyond its calibration tail and that uncertainty is absent from the
    plotted bars. No robust optimum is resolved in the grid.
  evidence:
  - data/part_f_optimum.json::the three separated losses and V_eff under both trials models
  - scripts/make_figures.py::figure_volume_losses, figure_veff
