claims:
- id: owen-matched-filter-loss
  statement: 'For normalized templates in Owen''s Gaussian-noise model, mismatch reduces the
    expected recovered SNR by the normalized template overlap.

    '
  evidence:
  - Owen, arXiv:gr-qc/9511032v1, Eqs. (1), (4)-(6), (10)
  - page/index.html::section 1, Scope and definitions
  numbers: []
- id: owen-local-metric
  statement: 'The Hessian of the match at coincident parameters defines a local metric with
    1-M = g_ij Delta-lambda^i Delta-lambda^j in Owen''s convention. The frozen finite-difference
    test passes the pre-registered relative-error criterion at mismatch 0.03, fails it at
    0.05, and does not establish an interval between those discrete radii.

    '
  evidence:
  - Owen, arXiv:gr-qc/9511032v1, Eqs. (11)-(13)
  - page/index.html::section 2, The metric we use
  numbers:
  - metric_validation_relative_error_limit
- id: owen-volume-count
  statement: 'Under Owen''s hypercubic covering model, the template count is proper parameter-space
    volume divided by the cell volume set by the minimal match.

    '
  evidence:
  - Owen, arXiv:gr-qc/9511032v1, Eqs. (14)-(16), (43)
  numbers:
