- file: figures/e_trials_measured_vs_naive.pdf
  produced_by: scripts/make_figures.py::figure_trials
  shows: Effective independent trials per segment, measured from simulated noise, against
    the naive bound that counts every template and every sample; and their ratio. The reader
    should take that the measured trials are nearly flat in bank size while the bound climbs,
    and that the ratio runs from about 7 to 58.
  from_scratch: the noise filtering through every template of all twenty banks, the maximum
    of |z| over templates and time per segment, and the closed-form MLE for the effective
    trial count
  from_library: the frozen upstream package's coloured_noise, kernel and psd_grid, whose single-sample
    statistic was verified there and re-verified here as a control; numpy FFT; matplotlib
  choices:
  - PDF text is embedded with TrueType fonts (font type 42) rather than Type 3 so labels
    remain searchable and render cleanly
  - 'REPLACES an earlier figure of rho* against MM, which violated rule F1: rho* is a closed
    function of the template count, so its y-values were computed from its x-values by the
    formula under test. A blind reviewer reconstructed every plotted point from N alone to
    within 1e-13. That figure has been withdrawn, not merely re-captioned'
  - 100 segments of 32 s, seed 20260926, the same noise driving every bank so the comparison
    across banks is paired
  - log x and log y on the left panel, because the measured series and the bound differ by
    up to a factor 58; linear ratio on the right, where the claim lives
  - 'explicit x ticks: the default log minor labels collide at this aspect ratio'
  - the calibration is done where the maxima fall, near |z| = 5.3 to 5.8, and is applied at
    thresholds near 8.0 to 8.6; that extrapolation is not tested here and is stated in the
    caption
  - per-bank fit uncertainties and paired-bootstrap 95 percent intervals for each family
    exponent are drawn or printed so the claimed sublinear slopes expose their precision
  how_this_could_fail: Independent templates would put the inferred counts on the naive line;
    proportional growth would make each family parallel to it. Neither pattern appears.
  supports:
  - detection-threshold
  - volume-loss-rule
