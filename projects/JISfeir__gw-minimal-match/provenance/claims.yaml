figures:
- file: figures/d_covering_cumulative.pdf
  produced_by: scripts/make_figures.py::figure_covering
  shows: 'Cumulative fraction of injections against the best match found in the bank, one
    panel per region, hexagonal and square overlaid, interior and border injections drawn
    apart. The reader should take that three of the four banks keep every injection right
    of MM = 0.97 and that the extended hexagonal interior curve crosses it.

    '
  from_scratch: 'the injection draw, the chirp-time map of each injection, the quadratic mismatch
    against every template of each bank, the border classification, and the empirical CDF

    '
  from_library: 'q1bC out/lib analytic_metric and tau (frozen 3.5PN projected-phase metric);
    numpy; matplotlib

    '
  choices:
  - PDF text is embedded with TrueType fonts (font type 42) rather than Type 3 so labels
    remain searchable and render cleanly
  - each interior/border curve is normalised within its own subset; the ordinate is therefore
    a conditional cumulative fraction, not a fraction of all injections
  - 3000 injections per region, uniform in component mass over the region -- a declared sampling
    choice, not an astrophysical population
  - seed 20260925, fixed before measuring
  - mismatch evaluated with the INJECTION's metric rather than the template's; the two differ
    and this is the convention the covering claim is stated in
  - log ordinate, without which a 1-in-1000 failure is invisible
  - border defined as within one covering radius of any region edge in the injection metric,
    on a boundary resampled at R/4 in proper length
  - colour follows the lattice and the region is the facet, so the reader learns one mapping
  how_this_could_fail: Any nonzero CDF ordinate left of MM = 0.97 refutes sampled covering.
  supports:
  - covering-at-mm097
