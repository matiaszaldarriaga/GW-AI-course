    match: the exact worst case 1 - MM^3, its linear expansion 3(1 - MM), and the metric-predicted
    population average 1 - <M^3>. The reader should take that the population loss is a factor
    4 to 9 below the worst case.

    '
  from_scratch: 'the population average from the injection matches of every bank in the MM
