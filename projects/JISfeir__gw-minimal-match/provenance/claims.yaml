- id: two-question-conclusion
  statement: >-
    In noise-free data the fractional SNR loss is exactly the mismatch. In the delivered
    MM = 0.97 banks, hexagonal placement uses fewer templates than square placement in both
    regions, but the saving differs by region and both hexagonal banks have adaptive
    counterexamples to strict covering; square placement has lower population-average
    discretisation loss and survives the same search. Densifying hexagonal placement reduces
    its loss, so neither lattice is universally better: the choice depends on template count,
    average loss, strict coverage, and effective detection volume. The much larger approximate
    loss in the extended region is driven mainly by TaylorF2 waveform-family error, while
    finite boundaries and the unresolved trials factor prevent a universal density or robust
    optimal minimal match from being inferred.
  evidence:
  - Owen, arXiv:gr-qc/9511032v1, Eqs. (1), (4)-(6), (10)-(16)
  - paper/main.tex::Scope and definitions; Limitations and conclusion
  - page/index.html::section 5, Conclusion
  - data/part_d_mm097.json::counts and boundary-repair composition
  - data/fig_witnesses.json::adaptive covering counterexamples
  - data/part_f_optimum.json::V_eff under naive and fitted trials models
