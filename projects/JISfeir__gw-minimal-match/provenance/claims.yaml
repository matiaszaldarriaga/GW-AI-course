- file: figures/f_veff_vs_mm.pdf
  produced_by: scripts/make_figures.py::figure_veff
  shows: 'Change in effective detection volume from the coarse end of the MM grid, under two
    models of the trials factor -- the naive bound and a nu_eff calibrated on simulated Gaussian
    noise -- for both regions and both lattices. The trend reverses between the two models,
    demonstrating model sensitivity rather than establishing which trend is correct; nu_eff
    calibration and tail-extrapolation uncertainty is not quantified; the curves are model
    scenarios rather than a measurement of the operating-threshold trend.'
  from_scratch: the population <M^3> from injections and its bootstrap; the calibration of
    nu_eff from the maximum of |z| over templates and time in 100 simulated noise segments,
    by closed-form MLE on the distribution of the maximum; the power-law fit of N_eff against
    template count with a paired bootstrap; and both threshold solutions
  from_library: q1bC out/lib coloured_noise, kernel and psd_grid, whose single-sample statistic
    P(|z|>r)=exp(-r^2/2) was verified there and re-verified here as a control; q1bC part B's
    frozen ff_full for the IMRPhenomD leg; scipy griddata and brentq; numpy FFT; matplotlib
  choices:
  - PDF text is embedded with TrueType fonts (font type 42) rather than Type 3 so labels
    remain searchable and render cleanly
  - TWO trials models are drawn rather than one, because the difference between them is the
    result; plotting only the calibrated curve would hide that the conclusion is model-dependent
  - the ordinate is the relative change from MM = 0.95, not the absolute V_eff, because the
    claim is the sign and the ~2 % size of the trend (rule F2); absolute values are in data/part_f_optimum.json
  - nu_eff calibrated on 100 segments of 32 s, seed 20260926, with the SAME noise driving
    every bank so the comparison across MM is paired and the slope uncertainty is not inflated
  - N_eff estimated by closed-form MLE on the distribution of the per-segment maximum; threshold-wise
    estimates vary across the fitted tail, and calibration near the simulated maxima is
    extrapolated to a higher detection threshold. This uncertainty is not quantified and
    can be material relative to the small V_eff trend
  - 'alpha fitted WITHIN each region and lattice family, never pooled: the pooled fit gives
    1.29 purely because the two regions have different N_eff levels, which is a Simpson effect
    and not a scaling'
  - the IMRPhenomD leg is not drawn here; it is a declared approximation and appears in data/part_f_optimum.json
    only
  - no precision-style error bars are shown, because the available injection bootstrap does
    not include the potentially material nu_eff and tail-extrapolation uncertainty
  how_this_could_fail: If the trials models agreed, the dashed and solid scenario curves
    would coincide; if a robust optimum existed, the calibrated curves would show a stable
    interior peak. Neither pattern appears.
  supports:
  - volume-loss-rule
  - detection-threshold
