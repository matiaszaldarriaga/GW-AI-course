- id: covering-at-mm097
  statement: 'Square and hexagonal banks are placed in (tau_0, tau_3) for the same nominal
    minimal match with a generation-wise local-metric method inspired by Cokelaer. The
    implementation replaces his explicit connector graph with distance-based collision
    suppression and adds its own greedy boundary repair, so its counts are not those of a
    faithful Cokelaer implementation. For both lattices we
    measure, by Monte Carlo over injected TaylorF2 signals and separately for interior and
    border injections, the fraction whose best match falls below MM, and determine whether
    any excess over the ideal geometric expectation comes from metric variation, the quadratic
    approximation, the boundaries or the implementation. The template counts are compared
    against the ideal constant-metric ratio 0.7698 and against all comparable Cokelaer banks:
    range 0.6605-0.7866 and mean 0.7191. The published range is descriptive, not an
    uncertainty interval.'
  status: 'MEASURED, and strict covering is REFUTED for both hexagonal banks: adaptive witnesses
    at mismatch 0.0322 and 0.0362 against a 0.03 target, reproduced independently. Both square
    banks survive the same search. The uniform-injection covering fractions have very little
    power and should not be read as support.'
  evidence:
  - data/part_d_mm097.json::counts, composition, covering fractions, border fractions
  - data/fig_covering.npz::per-injection best match and border flag, 3000 per region
  - data/fig_witnesses.json::the two adaptive-search witnesses that refute strict covering
  - data/region_geometry.json::proper areas, perimeters and effective widths
  - scripts/make_figures.py::figure_covering, figure_counts, figure_mismatch_map
