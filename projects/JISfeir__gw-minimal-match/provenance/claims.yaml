- file: figures/d_counts_and_ratio.pdf
  produced_by: scripts/make_figures.py::figure_counts
  shows: 'Top: bank size against nominal minimal match, both regions and both lattices, log
    ordinate. Bottom: the measured hexagonal/square count ratio against the ideal 0.7698 and
    the full 0.6605-0.7866 range recomputed from Cokelaer 2007, whose mean is 0.7191. The
    reader should take that the two regions do not share a universal ratio; the comparison
    does not validate this project as a faithful implementation of Cokelaer.

    '
  from_scratch: 'every bank in the MM grid was placed by work/d1/placement.py; the counts
    and the ratio are read from those banks

    '
  from_library: 'numpy; matplotlib. The reference values are quoted: 0.7698 is the constant-metric
    geometry (square cell 2R^2, hexagonal 3*sqrt(3)R^2/2); 0.6605-0.7866 and mean 0.7191 are
    recomputed from all comparable banks in Cokelaer 2007 Tables I-II

    '
  choices:
  - PDF text is embedded with TrueType fonts (font type 42) rather than Type 3 so labels
    remain searchable and render cleanly
  - ordinate spans 0.60-0.90 so the measured series and full published reference range remain
    legible
  - the counts are FULL banks, including the boundary repair, which is 50.7 % of the main
    hexagonal bank and 17.0 % of the extended square one; lattice-only ratios are 0.4882 and
    0.4225 and are reported in the text, not here
  - the Cokelaer range is a lightly shaded descriptive band and its mean is a separate line;
    the band is not presented as an uncertainty interval
  - MM grid 0.95-0.99 in steps of 0.01
  how_this_could_fail: If lattice efficiency alone set the ratio, both regions would follow
    one MM-independent line near the constant-metric ideal; they do not.
  supports:
  - covering-at-mm097
