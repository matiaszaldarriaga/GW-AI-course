- id: piloto-lphi4-resonancia-floquet
  statement: En el piloto lphi4 (N=128, q=120) el campo hijo crece segun la teoria de Floquet (ecuacion
    de Lame) al 0.4 % en el maximo, siempre que se use la amplitud conforme real del inflaton, A = 1.138,
    que resulta del transitorio inicial en que a''/a no es despreciable; con amplitud 1 la diferencia
    seria del 14 %.
  verificacion: 'μ por modo medido en el espectro de χ contra Floquet con la amplitud conforme medida (acuerdo 0.4 %) y chequeo cruzado con dos implementaciones de Floquet (vectorizada y RK4).'
