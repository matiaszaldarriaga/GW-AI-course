- id: GWs-produccion
  statement: 'En los tres modelos la energia en GWs crece en la fase lineal como el cuadrado de la del campo
    (pendiente 1.76-1.88 veces la del campo; se espera 2). SU(2)xU(1) produce sus ondas antes: 25 % del final
    (k <= 4) ya en tau = 100 y 80 % en tau = 120, cuando las W recien empiezan; el control 3 % y 48 %, U(1) 2 % y
    35 %. El exceso cerca del pico no viene de las W. Normalizando por la energia transferida al cuadrado, U(1)
    es 0.94 veces tan eficiente como el control (tiene menos ondas porque recibe menos energia) y SU(2)xU(1) 1.31.
    Hoy el pico queda en h2 Omega ~ 1e-10 a ~6e7 Hz. Una semilla.

    '
  verificacion: 'Pendiente de ρ_GW contra la del campo (se espera 2, se mide 1.76-1.88 en los tres); épocas medidas con el espectro cada 5 τ usando que Ω_GW no cambia sin fuente; conversión a hoy con la misma función validada contra Dufaux en el piloto. Una semilla.'
  evidence:
  - code/produccion_gws.py::main
  - data/produccion_gws.json
  numbers:
  - gws_fraccion_antes_tau100
  - gws_tau_mitad
