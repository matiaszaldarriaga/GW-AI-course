- id: SU2-vacio-transversal-mezcla
  statement: 'CosmoLattice arranca SU(2) con los links en la identidad y solo E longitudinal (como U(1)).
    El parche su2_vacio_transversal agrega vacio transversal. Con el doblete de fondo, A y el color B1 se
    mezclan (tipo Z/foton): autoestados foton (m2 = 0), Z (m2 = 240) y dos W (m2 = 120). Generar cada campo
    con su masa diagonal (v1) da un vacio que chapotea (B_U1 x3.6 en t = 0.7); con autoestados queda
    estacionario como la referencia lphi4U1. Energia en t = 0 igual a la analitica (B 1.03, E 0.90).

    '
  verificacion: 'Dos pruebas cortas con la misma semilla (defecto y vacío transversal): ruido del doblete idéntico (2e-15), energía agregada contra la analítica (B 1.03), matriz de masas simétrica verificada por el programa, estacionariedad contra la referencia lphi4U1 y prueba ×1000 para salir del piso de redondeo (code/validar_vacio_su2.py).'
