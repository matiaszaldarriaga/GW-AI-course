- id: SU2U1-resultados
  statement: 'En SU(2)xU(1) con vacio transversal (N = 64, una semilla) la combinacion Z + foton resuena como chi y
    como A de U(1) (1 % en tau = 68, mu 0.225 por modo, Floquet q = 120). Las W crecen lento en la fase lineal
    (mu de la energia 0.07, Floquet q = 60 da 0.12) y se disparan despues (1 % en tau = 117, mu 0.18 en tau 100-125),
    cuando la Z ya es no lineal. Al final los gauge tienen 64 % de la energia (chi 48 %, A de U(1) 40 %), mitad
    Z + foton y mitad W. Espectro de GWs en k = 0.5-2.5: 1.11 veces el control en promedio (0.64-1.92), 1.68 veces
    U(1); rho_GW total 0.71 veces el control, dominado por k > 4 no convergido.

    '
  verificacion: 'Calidad numérica monitoreada (Gauss SU(2) ≤ 1.2e-6, U(1) ≤ 1.1e-9, Friedmann ≤ 4e-4); μ de la Z contra Floquet q = 120 y contra A de lphi4U1; separación Z/W con su término cruzado medido (≤ 0.1 %) y piso de redondeo acotado. Una sola semilla: el exceso de GWs se compara con la dispersión entre semillas del control.'
  evidence:
