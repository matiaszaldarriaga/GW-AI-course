  - gws_hoy
- id: forma-espectro
  statement: 'La forma del espectro de GWs en la parte convergida (k <= 4) cambia con el campo gauge: el control
    tiene una meseta de k = 2 a 4 (pendiente 0.09 +- 0.12), U(1) sube hacia el UV (0.55 +- 0.12) con el maximo en el
    borde de lo convergido, y SU(2)xU(1) tiene un pico en k = 2, 1.7 veces la meseta del control, que cae con pendiente
    -1.8. Del lado IR las pendientes son compatibles entre si (~1). La posicion del maximo no se puede comparar en
    control y U(1) porque es una meseta o esta en el borde.

    '
  verificacion: 'Pendientes medidas en las tres semillas del control y de U(1): la dispersion entre semillas es la barra
    de error. SU(2)xU(1) tiene una sola semilla, pero su pico (6.6e-6) esta 60 % por encima del maximo de las seis
    corridas de control y U(1) (3.9-4.3e-6). Pendiente IR del control compatible con el piloto N = 128 (f^0.96).'
  evidence:
  - code/pendientes_espectro.py::main
  - data/pendientes_espectro.json
