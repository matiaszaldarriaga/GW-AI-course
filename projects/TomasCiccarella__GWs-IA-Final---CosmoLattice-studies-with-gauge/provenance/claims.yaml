- id: lphi4-in-es-fin-de-inflacion
  statement: Los valores iniciales de lphi4.in v2.0 (5.6964e18 GeV, -4.86735e30 GeV^2) son exactamente
    el estado de lambda*phi^4/4 con lambda = 9e-14 en el momento en que termina la inflacion (eps_H =
    1). Los del Manual v1, iguales al doblete de lphi4SU2U1.in x sqrt(2), son de antes (eps_H = 0.67).
  verificacion: 'Integración numérica independiente de la ecuación de fondo de λφ⁴/4 hasta ε_H = 1 (fin_inflacion_lphi4), comparada con los valores del .in a 5 cifras.'
  evidence:
